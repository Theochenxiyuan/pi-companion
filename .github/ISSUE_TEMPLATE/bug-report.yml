name: 源码内测问题
description: 报告从源码构建、启动或使用 Pi Companion 时遇到的问题
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: |
        感谢参与内测。不要在公开 Issue 中上传 API Key、OAuth Token、Prompt、个人文件内容、完整诊断 ZIP 或未脱敏日志。安全漏洞请改用仓库的安全报告流程。

  - type: input
    id: commit
    attributes:
      label: 测试的 commit
      description: 在仓库运行 `git rev-parse --short HEAD`。
      placeholder: 例如 9549295
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 提供版本与 Build；可运行 `winver` 查看。
      placeholder: Windows 11 25H2, Build 26200
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: 环境诊断
      description: 粘贴 `scripts/doctor.ps1` 的输出；先确认其中没有需要隐藏的信息。
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从应用启动前的状态开始，列出最短、稳定的复现步骤。
      placeholder: |
        1. 运行 ...
        2. 打开 ...
        3. 选择 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附上已脱敏的截图或最小错误片段。
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都出现
        - 经常出现
        - 偶尔出现
        - 只出现过一次
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除凭据、Prompt、个人文件内容、个人路径和其他敏感信息。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
